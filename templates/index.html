{% load humanize %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <!-- https://cdnjs.com/libraries/twitter-bootstrap/5.0.0-beta1 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/css/bootstrap.min.css"
    />

    <!-- Icons: https://getbootstrap.com/docs/5.0/extend/icons/ -->
    <!-- https://cdnjs.com/libraries/font-awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"
    />

    <title>DJANGO TABLE SHOP</title>
  </head>
  <body class="container mt-3">
    <header>
        <div class="alert alert-info text-center display-3" role="alert">
            Tienda Online
        </div>
    </header>

    <main>

        {% if productos %}

        <div class="row justify-content-center align-items-center g-2">
            {% for p in productos %}
                <div class="col-md-4">
                    <div class="card">
                        {% if p.ImagenCaja %}
                            <img src="{{ p.ImagenCaja.url }}" class="card-img-top" alt="{{ p.Nombre }}">
                        {% endif %}
                        <div class="card-body">
                            <h5 class="card-title">{{ p.Nombre }}</h5>
                            <p class="card-text">Precio: CLP $ {{ p.Valor|intcomma }}</p>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>

        {% else %}

        <div class="alert alert-warning text-center" role="alert">
            <strong>No hay juegos disponibles</strong>
        </div>

        {% endif %}

    </main>

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/js/bootstrap.bundle.min.js"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->

    <!-- https://cdnjs.com/libraries/popper.js/2.5.4 -->
    <!-- <script
      src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.5.4/umd/popper.min.js"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/js/bootstrap.min.js"
    ></script> -->

    <!-- More: https://getbootstrap.com/docs/5.0/getting-started/introduction/ -->
  </body>
</html>
